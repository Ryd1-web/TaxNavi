# TaxNavi: PostgreSQL + .NET API + Next.js frontend.
# Usage: copy .env.example to .env, fill it in, then: docker compose up -d --build
# Secrets come only from .env (git-ignored); compose refuses to start if a required one is missing.

services:
  db:
    image: postgres:16-alpine
    container_name: taxnavi-db
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"   # for pgAdmin/psql on this machine only
    environment:
      POSTGRES_DB: taxnavi
      POSTGRES_USER: taxnavi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxnavi -d taxnavi"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [taxnavi]

  api:
    build:
      context: ./backend
    container_name: taxnavi-api
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=taxnavi;Username=taxnavi;Password=${POSTGRES_PASSWORD}"
      DatabaseSetup__ApplyOnStartup: "true"   # applies EF migrations on start; idempotent
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      App__FrontendUrl: ${FRONTEND_URL:-http://localhost:3000}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:3000}
      Paystack__SecretKey: ${PAYSTACK_SECRET_KEY:-}
      Paystack__SmePlanCode: ${PAYSTACK_SME_PLAN_CODE:-}
      Paystack__AllowLiveKeys: ${PAYSTACK_ALLOW_LIVE_KEYS:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [taxnavi]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time: the URL browsers use to reach the API.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: taxnavi-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped
    networks: [taxnavi]

volumes:
  pg_data:

networks:
  taxnavi:
